services:
  frontend:
    ports: !override
      - "3010:3000"
    # Bind mount no Docker Desktop (Windows) não emite evento de filesystem: o
    # Vite nunca invalidava o módulo e servia o transform em cache mesmo com o
    # arquivo já novo dentro do container. O compose liga polling só no backend.
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "400"
